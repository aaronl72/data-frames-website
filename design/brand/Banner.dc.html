<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #16211c; color: #cdd8d2;
           font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    a { color: #38a68f; text-decoration: none; }
    a:hover { color: #63c08a; }
    .disp { font-family: 'Instrument Serif', Georgia, 'Iowan Old Style', serif; font-weight: 400; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace; }
    p { margin: 0; }
  </style>
</helmet>

<!-- 1584 x 396, the LinkedIn company banner. The left third is deliberately
     near-empty: LinkedIn drops the round profile tile on top of it. -->
<div style="position: relative; width: 1584px; height: 396px; background: #16211c;
            box-sizing: border-box; overflow: hidden;">

  <div style="position: absolute; left: 84px; top: 50%; transform: translateY(-50%); line-height: 0;">
    <svg width="286" height="286" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <g stroke="#223129" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M6 17.5 L6 6 L17.5 6"/><path d="M30.5 6 L42 6 L42 17.5"/>
        <path d="M42 30.5 L42 42 L30.5 42"/><path d="M17.5 42 L6 42 L6 30.5"/>
      </g>
      <circle cx="24" cy="24" r="5" fill="#223129"/>
    </svg>
  </div>

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0;
              display: flex; flex-direction: column; justify-content: center; gap: 22px;
              padding: 0 96px 0 520px;">

    <div style="display: flex; align-items: center; gap: 20px;">
      <svg width="66" height="66" viewBox="0 0 48 48" fill="none" aria-label="Data-Frames">
        <g stroke="#38a68f" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter">
          <path d="M6 17.5 L6 6 L17.5 6"/><path d="M30.5 6 L42 6 L42 17.5"/>
          <path d="M42 30.5 L42 42 L30.5 42"/><path d="M17.5 42 L6 42 L6 30.5"/>
        </g>
        <circle cx="24" cy="24" r="5" fill="#38a68f"/>
      </svg>
      <span class="disp" style="font-size: 60px; line-height: 1; color: #ffffff;">Data-Frames</span>
    </div>

    <p class="disp" style="font-size: 34px; line-height: 1.2; color: #cdd8d2; letter-spacing: -0.01em;">Enterprise-level security. <span style="font-style: italic; color: #38a68f;">SMB-friendly pricing.</span></p>

    <div style="display: flex; align-items: center; gap: 16px;">
      <span class="mono" style="font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b7d75;">Continuous detection</span>
      <span style="width: 4px; height: 4px; border-radius: 50%; background: #2c3d35; flex-shrink: 0;"></span>
      <span class="mono" style="font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b7d75;">Offensive testing</span>
      <span style="width: 4px; height: 4px; border-radius: 50%; background: #2c3d35; flex-shrink: 0;"></span>
      <span class="mono" style="font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b7d75;">Automated response</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
