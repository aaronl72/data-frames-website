<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #16211c; }
    a { color: #38a68f; text-decoration: none; }
    a:hover { color: #63c08a; }
  </style>
</helmet>

<!-- 400 x 400. Square profile picture for LinkedIn, X, GitHub. Most platforms
     crop this to a circle, so the mark sits well inside the corners. -->
<div style="width: 400px; height: 400px; background: #16211c; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;">
  <svg width="196" height="196" viewBox="0 0 48 48" fill="none" aria-label="Data-Frames">
    <g stroke="#38a68f" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M6 17.5 L6 6 L17.5 6"/><path d="M30.5 6 L42 6 L42 17.5"/>
      <path d="M42 30.5 L42 42 L30.5 42"/><path d="M17.5 42 L6 42 L6 30.5"/>
    </g>
    <circle cx="24" cy="24" r="5" fill="#38a68f"/>
  </svg>
</div>
</x-dc>
</body>
</html>
