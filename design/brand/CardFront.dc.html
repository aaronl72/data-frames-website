<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #16211c; color: #cdd8d2;
           font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    a { color: #38a68f; text-decoration: none; }
    a:hover { color: #63c08a; }
    .disp { font-family: 'Instrument Serif', Georgia, 'Iowan Old Style', serif; font-weight: 400; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace; }
  </style>
</helmet>

<!-- 3.5 x 2 in at 96 px/in. Everything sits at least 20px inside the trim. -->
<div style="width: 336px; height: 192px; background: #16211c; box-sizing: border-box;
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;">

  <div style="display: flex; align-items: center; justify-content: flex-end;">
    <span style="width: 42px; height: 2px; background: #38a68f;"></span>
  </div>

  <div style="display: flex; align-items: center; gap: 13px;">
    <svg width="38" height="38" viewBox="0 0 48 48" fill="none" aria-label="Data-Frames">
      <g stroke="#38a68f" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M6 17.5 L6 6 L17.5 6"/><path d="M30.5 6 L42 6 L42 17.5"/>
        <path d="M42 30.5 L42 42 L30.5 42"/><path d="M17.5 42 L6 42 L6 30.5"/>
      </g>
      <circle cx="24" cy="24" r="5" fill="#38a68f"/>
    </svg>
    <span class="disp" style="font-size: 34px; line-height: 1; color: #ffffff;">Data-Frames</span>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px;">
    <span class="mono" style="font-size: 12px; letter-spacing: 0.11em; text-transform: uppercase; color: #6b7d75;">Security operations</span>
    <span class="mono" style="font-size: 12px; color: #38a68f;">data-frames.com</span>
  </div>

</div>
</x-dc>
</body>
</html>
