<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #f7f5f1; color: #2b352f;
           font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    a { color: #0f6b5c; text-decoration: none; }
    a:hover { color: #0a4c41; }
    .disp { font-family: 'Instrument Serif', Georgia, 'Iowan Old Style', serif; font-weight: 400; }
    .mono { font-family: 'IBM Plex Mono', Consolas, 'SF Mono', Menlo, monospace; }
  </style>
</helmet>

<!-- 3.5 x 2 in at 96 px/in. Square-bracketed text is yours to fill in. -->
<div style="width: 336px; height: 192px; background: #f7f5f1; box-sizing: border-box;
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;">

  <div style="display: flex; align-items: center; gap: 9px;">
    <svg width="20" height="20" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <g stroke="#0f6b5c" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M6 17.5 L6 6 L17.5 6"/><path d="M30.5 6 L42 6 L42 17.5"/>
        <path d="M42 30.5 L42 42 L30.5 42"/><path d="M17.5 42 L6 42 L6 30.5"/>
      </g>
      <circle cx="24" cy="24" r="5" fill="#0f6b5c"/>
    </svg>
    <span class="disp" style="font-size: 18px; line-height: 1; color: #16211c;">Data-Frames</span>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;">

    <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
      <span class="disp" style="font-size: 23px; line-height: 1; color: #16211c;">[YOUR NAME]</span>
      <span class="mono" style="font-size: 12px; letter-spacing: 0.11em; text-transform: uppercase; color: #0f6b5c;">[Your title]</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0;">
      <span class="mono" style="font-size: 12px; color: #5f6b63;">[you@data-frames.com]</span>
      <span class="mono" style="font-size: 12px; color: #5f6b63;">[+44 0000 000000]</span>
      <span class="mono" style="font-size: 12px; color: #16211c;">data-frames.com</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
